
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>NORDRAIN – Beyond The Sound</title>
<meta name="description" content="NORDRAIN – Beyond The Sound. The music of Nina & Erik.">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #050505;
  color: #eee;
  font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

header {
  background: #050505;
  min-height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px 28px;
}

.logo {
  font-family: "Times New Roman", Georgia, serif;
  font-size: clamp(38px, 6vw, 68px);
  font-weight: 400;
  letter-spacing: 0.30em;
  padding-left: 0.30em;
  text-align: center;
  color: #b9b9b9;
  background: linear-gradient(
    180deg,
    #f0f0f0 0%,
    #a9a9a9 35%,
    #686868 65%,
    #d0d0d0 100%
  );
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 24px rgba(190,190,190,0.10);
}

.tagline {
  margin-top: 13px;
  font-size: 10px;
  letter-spacing: 0.42em;
  color: #777;
  text-transform: uppercase;
}

/* SOCIAL ICONS */

.socials {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  margin-top: 29px;
}

.socials a {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #c4c4c4;
  border: 1px solid #333;
  border-radius: 4px;
  transition: all 0.3s ease;
}

.socials a:hover {
  color: #fff;
  border-color: #aaa;
  background: #202020;
  transform: translateY(-3px);
}

.socials svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

/* HERO VIDEO */

.hero {
  width: 100%;
  height: min(70vh, 680px);
  min-height: 360px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at center, #292929 0%, #101010 45%, #030303 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.88;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,0.12),
    rgba(0,0,0,0.30),
    rgba(0,0,0,0.65)
  );
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 20px;
}

.hero-content h1 {
  font-family: Georgia, serif;
  font-size: clamp(24px, 4vw, 42px);
  font-weight: 400;
  letter-spacing: 0.25em;
  color: #d0d0d0;
}

.hero-content p {
  margin-top: 18px;
  font-size: 11px;
  letter-spacing: 0.4em;
  color: #aaa;
}

/* FOOTER */

footer {
  min-height: 110px;
  background: #050505;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 25px;
}

footer p {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: #666;
}

footer span {
  color: #999;
}

/* MOBILE */

@media (max-width: 600px) {
  header {
    min-height: 155px;
    padding-top: 28px;
  }

  .logo {
    font-size: 35px;
    letter-spacing: 0.20em;
  }

  .tagline {
    font-size: 8px;
  }

  .socials {
    gap: 15px;
    margin-top: 23px;
  }

  .socials a {
    width: 38px;
    height: 38px;
  }

  .hero {
    height: 60vh;
    min-height: 320px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">NORDRAIN</div>
  <div class="tagline">Beyond The Sound</div>

  </nav>
</header>

<main>
  <section class="hero">

    <!-- Add the NORDRAIN concert video later:
         upload it as assets/nordrain-hero.mp4 -->

    <video autoplay muted loop playsinline>
      <source src="assets/nordrain-hero.mp4" type="video/mp4">
    </video>

    <div class="hero-content">
      <h1>NORDRAIN</h1>
      <p>BEYOND THE SOUND</p>
    </div>

  </section>
</main>

<footer>
  <p><span>NORDRAIN</span> &nbsp; © 2026</p>
  <p>BEYOND THE SOUND</p>
</footer>

</body>
</html>
